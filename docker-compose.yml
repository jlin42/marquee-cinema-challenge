services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marquee
      POSTGRES_PASSWORD: marquee
      POSTGRES_DB: marquee
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquee -d marquee"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
